<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./src/assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./src/css/main.scss">
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="card-header">
        <img src="./src/assets/images/illustration-article.svg" alt="Illustration Article">
      </div>

      <div class="card-content">
        <span class="card-category">Learning</span>
        <p>Published 21 Dec 2023</p>
        <h1>HTML & CSS foundations</h1>
        <p class="card-description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>

      <div class="card-footer">
        <img src="./src/assets/images/image-avatar.webp" alt="Autor Avatar">
        <p>Greg Hooper</p>
      </div>
    </div>
  </main>

  <footer class="attribution">
    <p>
      Challenge by <a href="https://www.frontendmentor.io/challenges/blog-preview-card-ckPaj01IcS" target="_blank">Frontend Mentor</a>
    </p>
    <div class="bullet"></div>
    <p>
      Coded by <a href="https://www.frontendmentor.io/profile/otaviozerotwo" target="_blank">Otávio Cardoso</a>
    </p>
  </footer>
</body>
</html>
